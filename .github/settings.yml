# Declarative repo configuration. Applied by the Settings GitHub App (https://github.com/apps/settings).
# The organization ruleset `default-branch-baseline` protects `main`.

repository:
  default_branch: main
  has_issues: true
  has_projects: false
  has_wiki: false
  has_discussions: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  delete_branch_on_merge: true

collaborators:
  - username: zyplux
    permission: push
